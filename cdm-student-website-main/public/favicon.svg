<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Colegio de Montalban</title>
  <!--
    CdM monogram badge (favicon).
    Colours are the literal sRGB equivalents of the design system tokens:
      primary   oklch(0.372 0.083 157) = #0A4D2E (evergreen)
      secondary oklch(0.84 0.15 84)  = #F8C143 (golden yellow)
    A favicon SVG is a standalone document and cannot read the app's CSS
    variables, so the hex values are inlined here.
  -->
  <circle cx="24" cy="24" r="23.5" fill="#F8C143" />
  <circle cx="24" cy="24" r="20" fill="none" stroke="#0A4D2E" stroke-width="1.5" opacity="0.85" />
  <path d="M24 12.2 31.4 16.3 24 20.4 16.6 16.3Z" fill="#0A4D2E" />
  <path d="M31.4 16.3v4.4" stroke="#0A4D2E" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="31.4" cy="21.8" r="1.1" fill="#0A4D2E" />
  <text
    x="24"
    y="34.6"
    text-anchor="middle"
    fill="#0A4D2E"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="12.4"
    font-weight="800"
    letter-spacing="-0.2"
  >CdM</text>
</svg>