# Security checks on every push / PR.
#
# Three gates, matching the manual pre-deploy checks in DEPLOYMENT.md:
#   1. npm audit  — known CVEs in dependencies (reported, non-blocking so one
#                   advisory can't jam every push; Dependabot PRs still land)
#   2. tsc        — type errors in frontend and backend (BLOCKING)
#   3. build      — the projects must still produce deployable bundles
#
# ADMIN_PIN is only needed at backend RUNTIME, not for type-checking, so the CI
# job deliberately does not have access to any real secret.
name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdm-student-website-main

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            cdm-student-website-main/package-lock.json
            cdm-student-website-main/backend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Audit frontend (report only)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Install backend deps
        working-directory: cdm-student-website-main/backend
        run: npm ci

      - name: Audit backend (report only)
        working-directory: cdm-student-website-main/backend
        run: npm audit --omit=dev --audit-level=high || true

      - name: Type-check backend
        working-directory: cdm-student-website-main/backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: cdm-student-website-main/backend
        run: npm run build
