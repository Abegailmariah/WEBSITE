# Keeps dependency vulnerabilities visible instead of letting them rot.
#
# Dependabot alerts (Settings -> Code security) turn any newly-disclosed CVE in
# our tree into a notification, and these update PRs bump the patched versions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cdm-student-website-main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Build-time-only tooling can wait for a batched PR.
    groups:
      frontend-tooling:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cdm-student-website-main/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
