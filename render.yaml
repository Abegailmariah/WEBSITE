# Render Blueprint — backend API
# Area-Based Academic Information Dissemination System using BLE Beacon Technology
#
# The frontend is hosted on Vercel. This file deploys ONLY the Express API in
# cdm-student-website-main/backend.
#
# How to use it:
#   1. Render Dashboard → New + → Blueprint
#   2. Connect the GitHub repo (Abegailmariah/WEBSITE)
#   3. Render reads this file and provisions the service, prompting for
#      ADMIN_PIN (it is never stored in Git).
#   4. Copy the resulting URL (https://cdm-ble-api.onrender.com) into the
#      VITE_* environment variables on Vercel, then redeploy the frontend.
#
# See DEPLOYMENT.md for the full checklist.

services:
  - type: web
    name: cdm-ble-api
    runtime: node
    # "free" has an EPHEMERAL filesystem — see the disk section at the bottom.
    plan: free
    # Closest region to the Philippines. Other options: oregon, ohio,
    # virginia, frankfurt.
    region: singapore
    rootDir: cdm-student-website-main/backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    # "/" is a shallow liveness probe. GET /health also verifies the SQLite
    # datastore answers, so monitor that one externally (see SECURITY.md).
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      # Cross-site cookies (Vercel frontend + Render API) require
      # SameSite=None; Secure, which NODE_ENV=production turns on.
      - key: COOKIE_SAMESITE
        value: none
      # The dashboard prompts for this during Blueprint creation and stores it
      # as a secret. It must be LONG and random (>= 32 hex chars) — it is the
      # only credential protecting every student concern in the system.
      # Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      - key: ADMIN_PIN
        sync: false
      # HMAC key that signs CSRF tokens. Render generates and stores it as a
      # secret so it never exists in Git. Rotating it only invalidates
      # outstanding tokens (the SPA re-bootstraps one per request).
      - key: CSRF_SECRET
        generateValue: true
      # Admin session policy: 2h sliding idle timeout, 12h absolute maximum.
      - key: SESSION_TTL_MS
        value: "7200000"
      - key: SESSION_ABSOLUTE_MAX_MS
        value: "43200000"
      # /admin/login brute-force lockout: 5 failures -> 15 min lock per IP.
      - key: ADMIN_MAX_FAILED
        value: "5"
      - key: ADMIN_LOCKOUT_MS
        value: "900000"
      # Must include the exact Vercel origin (scheme + host, no trailing slash).
      - key: CORS_ORIGINS
        value: https://cdm-student-website-main.vercel.app

    # ── Persistent storage (requires a PAID plan) ──────────────────────
    # Render's free tier has an ephemeral filesystem: cdm_portal.db is deleted
    # on every restart or redeploy, so announcements and concerns revert to the
    # seed data (and admin/student sessions are lost). Persistent disks are
    # only available on paid instance types.
    #
    # To persist real data: set `plan: starter` above and uncomment the block
    # below together with the DB_PATH variable. The app reads DB_PATH
    # (see backend/src/database.ts) and writes the SQLite file there.
    #
    # disk:
    #   name: cdm-data
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    #   - key: DB_PATH
    #     value: /var/data/cdm_portal.db